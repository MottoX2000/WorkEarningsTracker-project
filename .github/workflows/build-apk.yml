name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WorkEarningsTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkEarningsTracker-apk
          path: WorkEarningsTracker.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: WorkEarningsTracker.apk

      - name: Push APK to "apk" branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp WorkEarningsTracker.apk /tmp/out/
          git checkout --orphan apk
          git rm -rf --cached . > /dev/null
          git clean -fdx -e WorkEarningsTracker.apk > /dev/null || true
          cp /tmp/out/WorkEarningsTracker.apk .
          git add -f WorkEarningsTracker.apk
          git commit -m "APK build ${{ github.run_number }}"
          git push -f origin apk
